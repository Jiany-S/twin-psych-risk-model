paths:
  run_root: experiments/runs
  replay_manifest: experiments/runs/replay_manifest_wesad_smoke.yaml

dataset:
  name: wesad
  source: local
  path: data/wesad/wesad_subset
  format: auto
  subjects: ["S2", "S3", "S4", "S5", "S6", "S7", "S8", "S9"]
  max_rows_per_subject: null
  stress_include_amusement: true

reproducibility:
  seed: 42

experiment:
  primary_target: stress
  task_name: fast WESAD protocol stress detection

targets:
  stress:
    label_col: y_stress
    task_type: classification
  comfort:
    label_col: y_comfort_proxy
    task_type: regression

stream:
  representation: raw_signal
  source_sampling_rate_hz: 700.0
  target_sampling_rate_hz: 4.0

fast_model:
  architectures: [dummy, logistic, tcn]
  context_seconds: 3.0
  forecast_horizon_seconds: 0.0
  inference_stride_seconds: 0.25
  threshold_policy: f1
  tcn:
    epochs: 2
    hidden_channels: 12
    kernel_size: 3
    layers: 2
    dropout: 0.1
    batch_size: 64
    learning_rate: 0.001

split:
  mode: subject_holdout
  train_subjects: ["S2", "S3", "S4", "S5"]
  validation_subjects: ["S6", "S7"]
  test_subjects: ["S8", "S9"]
  train_ratio: 0.55
  val_ratio: 0.25
  test_ratio: 0.20
  seed: 42

features:
  timestamp: timestamp
  time_idx: time_idx
  worker_id: worker_id
  protocol_label: protocol_label
  physiology: [ecg, eda, temp]
  use_robot_context: false
  robot_context: []
  optional:
    hazard_zone: hazard_zone
    task_phase: task_phase
    specialization_col: specialization_index
    experience_col: experience_level
