paths:
  raw_dir: data/raw
  raw_file: data/raw/data.csv
  run_root: experiments/runs

dataset:
  name: multiphysio
  report_name: MultiPhysio-HRC cognitive workload benchmark (bio 60s features)
  path: data/multiphysio
  multiphysio:
    feature_columns:
      hrv_mean_nn: HRV_MeanNN
      eda_mean: EDA_mean
      emg_rmse: EMG_RMSE
      rrv_mean_bb: RRV_MeanBB
    repetition_offset: 1
    min_rows_per_worker: 40

reproducibility:
  seed: 42

targets:
  multi_head:
    enabled: true
  cognitive_load:
    label_col: y_cognitive_load
    source_col: NASA
    source_questionnaire: NASA-TLX
    source_range: [0, 100]
    task_type: regression
    threshold: null
  cognitive_load_binary:
    label_col: y_cognitive_load_binary
    source_col: NASA
    source_questionnaire: NASA-TLX
    source_range: [0, 100]
    task_type: classification
    threshold: 40.0
  stress:
    label_col: y_stress
    source_col: STAI
    source_questionnaire: STAI-Y1
    source_range: [20, 80]
    task_type: regression
    threshold: null
  comfort:
    label_col: y_comfort_proxy
    source_col: Valence
    source_questionnaire: SAM Valence
    source_range: [1, 5]
    task_type: regression
    threshold: null
  arousal:
    label_col: y_arousal
    source_col: Arousal
    source_questionnaire: SAM Arousal
    source_range: [1, 5]
    task_type: regression
    threshold: null

experiment:
  primary_target: cognitive_load_binary
  task_name: high versus low cognitive workload from NASA-TLX

task:
  horizon_steps: 1
  window_length: 8
  sampling_rate_hz: 0.0166667  # 60-second feature windows
  window_step: 1

split:
  mode: time
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

profiles:
  include_calibration_features: false
  include_role_metadata: false
  include_experience_metadata: false

features:
  timestamp: timestamp
  time_idx: time_idx
  worker_id: worker_id
  protocol_label: protocol_label
  physiology: [hrv_mean_nn, eda_mean, emg_rmse, rrv_mean_bb]
  engineering_mode: precomputed
  use_robot_context: false
  robot_context: [distance_to_robot, robot_speed]
  optional:
    hazard_zone: hazard_zone
    task_phase: task_phase
    specialization_col: specialization_index
    experience_col: experience_level
  hrv:
    include_freq_domain: false
  eda:
    scr_threshold: 0.05
    min_scr_distance: 3

models:
  run_xgb: true
  run_tft: false

xgboost:
  max_depth: 4
  n_estimators: 120
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9
  early_stopping_rounds: 20
  calibration: isotonic
  tree_method: auto
  predictor: auto

tft:
  strategy: multi_model
  max_epochs: 2
  hidden_size: 16
  lstm_layers: 1
  dropout: 0.1
  batch_size: 64
  num_workers: 0
  gpus: 0
  early_stop_patience: 2
  learning_rate: 1.0e-3
  tft_loss: quantile

report:
  top_k_features: 15
