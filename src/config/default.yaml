paths:
  raw_dir: data/raw
  raw_file: data/raw/data.csv
  run_root: experiments/runs

dataset:
  name: synthetic   # wesad | multiphysio | synthetic | csv
  source: local     # local | kaggle_api (wesad only)
  path: data/raw
  format: auto      # auto | wesad_pickle | csv
  kaggle_dataset: orvile/wesad-wearable-stress-affect-detection-dataset
  kaggle_cache_dir: data/wesad/wesad_kaggle
  kaggle_force_download: false

reproducibility:
  seed: 42

targets:
  multi_head:
    enabled: true
  stress:
    label_col: y_stress
    task_type: classification
  comfort:
    label_col: y_comfort_proxy
    task_type: regression

experiment:
  primary_target: stress
  task_name: stress classification

task:
  context_seconds: 15.0
  forecast_horizon_seconds: 1.25
  inference_stride_seconds: 0.25

stream:
  representation: raw_signal
  source_sampling_rate_hz: 4.0
  target_sampling_rate_hz: 4.0

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

normalization:
  mode: global  # global | calibration

calibration:
  protocol_labels: [baseline, rest]
  task_phases: []
  max_rows_per_subject: 120
  include_median: true
  robust_scale: iqr

profiles:
  include_calibration_features: false
  include_role_metadata: false
  include_experience_metadata: false

features:
  timestamp: timestamp
  time_idx: time_idx
  worker_id: worker_id
  protocol_label: protocol_label
  physiology: [ecg, eda, temp]
  engineering_mode: raw_signals
  robot_context: [distance_to_robot, robot_speed]
  optional:
    hazard_zone: hazard_zone
    task_phase: task_phase
    specialization_col: specialization_index
    experience_col: experience_level
  hrv:
    include_freq_domain: true
  eda:
    scr_threshold: 0.05
    min_scr_distance: 3

synthetic:
  enabled_if_missing: true
  use_existing_raw: false
  num_workers: 6
  num_timesteps: 280
  missing_rate: 0.02
  seed: 123

models:
  run_dummy: true
  run_logistic: true
  run_random_forest: true
  run_xgb: true
  run_tft: true

dummy:
  strategies: [most_frequent, stratified]

logistic_regression:
  C: 1.0
  max_iter: 1000
  solver: lbfgs
  class_weight: balanced
  calibration: none  # none | platt

random_forest:
  n_estimators: 200
  max_depth: null
  min_samples_leaf: 1
  class_weight: balanced
  n_jobs: -1

xgboost:
  max_depth: 4
  n_estimators: 200
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9
  early_stopping_rounds: 20
  calibration: isotonic   # isotonic | platt | none
  tree_method: auto
  predictor: auto

tft:
  strategy: multi_model
  max_epochs: 3
  hidden_size: 24
  lstm_layers: 1
  dropout: 0.1
  batch_size: 64
  num_workers: 0
  gpus: 1
  early_stop_patience: 2
  learning_rate: 1.0e-3
  tft_loss: quantile  # quantile | bce

report:
  top_k_features: 15
